name: Toffee Cookie Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Execute Update
        run: |
          python3 - << 'EOF'
          import requests, json, datetime, os, sys

          # ১. রিয়েল ডিভাইস থেকে সংগৃহীত টফি সিকিউর কুকি অ্যান্ডপয়েন্ট
          def get_direct_toffee_cookie():
              # App Session Init Endpoint
              url = "https://toffeelive.com/api/v1/init"
              
              # Standard User Agent matching stream playback
              user_agent = "Toffee (Linux; Android 14)"
              
              headers = {
                  "User-Agent": user_agent,
                  "Accept": "application/json, text/plain, */*",
                  "X-Requested-With": "com.toffee.live",
                  "Origin": "https://toffeelive.com",
                  "Referer": "https://toffeelive.com/"
              }

              try:
                  session = requests.Session()
                  # Root URL-এ প্রথম রিকোয়েস্ট পাঠিয়ে Edge Cookie নেওয়া
                  session.get("https://toffeelive.com/", headers=headers, timeout=15)
                  
                  # API Endpoint হিট করা
                  res = session.get(url, headers=headers, timeout=15)
                  
                  cookies_dict = session.cookies.get_dict()
                  
                  # যদি Session Cookies পাওয়া যায়
                  if cookies_dict:
                      cookie_str = "; ".join([f"{k}={v}" for k, v in cookies_dict.items()])
                      return cookie_str, user_agent
                  
                  # Header এ সরাসরি থাকলে
                  raw_cookie = res.headers.get("Set-Cookie")
                  if raw_cookie:
                      return raw_cookie, user_agent

                  return None, user_agent
              except Exception as e:
                  print(f"[-] Cookie Fetch Exception: {e}")
                  return None, user_agent

          SRC_JSON = "api.json"

          try:
              print("[+] Fetching fresh Toffee Session Cookie...")
              ck, app_ua = get_direct_toffee_cookie()
              
              if not ck:
                  print("[-] Error: Direct Cookie Generation Failed!")
                  sys.exit(1)

              print(f"[+] Cookie fetched successfully: {ck[:35]}...")

              if not os.path.exists(SRC_JSON):
                  print(f"[-] Error: '{SRC_JSON}' file is missing in root repository!")
                  sys.exit(1)

              with open(SRC_JSON, "r", encoding="utf-8") as f:
                  channels = json.load(f)

              if not channels:
                  print("[-] Error: api.json is empty!")
                  sys.exit(1)

              ns_json = []
              ott_playlist = "#EXTM3U\n"
              updated = datetime.datetime.now().strftime("%d-%m-%Y %I:%M:%S %p")

              tengo = {
                  "name": "Toffee App All Channels",
                  "owner": "Eamin Talukdar \\ Telegram: https://t.me/eamintalukdar",
                  "channels_amount": 0,
                  "updated_on": updated,
                  "channels": []
              }

              for ch in channels:
                  link = ch.get("link")
                  if not link:
                      continue

                  name = ch.get("name", "Live")
                  logo = ch.get("logo", "")
                  cat  = ch.get("category_name", "Bangladeshi")
                  
                  try:
                      host = link.split("//")[-1].split("/")[0]
                  except Exception:
                      host = ""

                  # NS Player Format
                  ns_json.append({
                      "name": name,
                      "logo": logo,
                      "link": link,
                      "User-Agent": app_ua,
                      "cookie": ck
                  })

                  # Script API Format
                  tengo["channels"].append({
                      "category_name": cat,
                      "name": name,
                      "link": link,
                      "logo": logo,
                      "headers": {
                          "Host": host,
                          "Cookie": ck,
                          "User-Agent": app_ua,
                          "Accept-Encoding": "gzip"
                      }
                  })

                  # OTT Navigator / IPTV standard playlist format
                  ott_playlist += f'#EXTINF:-1 group-title="{cat}" tvg-logo="{logo}", {name}\n'
                  ott_playlist += f'#EXTVLCOPT:http-user-agent={app_ua}\n'
                  ott_playlist += f'#EXTVLCOPT:http-cookie={ck}\n'
                  ott_playlist += f'{link}\n'

              tengo["channels_amount"] = len(ns_json)

              # ১. NS Player format
              with open("NS_Player.m3u", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              # ২. Channels JSON
              with open("channels.json", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              # ৩. Script API JSON
              with open("Script_Api.json", "w", encoding="utf-8") as f:
                  json.dump(tengo, f, indent=2)

              # ৪. OTT Navigator M3U Playlist
              with open("OTT_Navigator.m3u", "w", encoding="utf-8") as f:
                  f.write(ott_playlist)

              print("[+] All playlists updated successfully!")

          except Exception as e:
              print(f"[-] Execution Error: {e}")
              sys.exit(1)
          EOF

      - name: Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || (git commit -m "🔁 Auto Update Toffee Streams" && git push origin main)
