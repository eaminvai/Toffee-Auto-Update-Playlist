name: Toffee Cookie Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Execute Update
        run: |
          python3 - << 'EOF'
          import requests, json, datetime, os, sys

          def get_direct_toffee_cookie():
              url = "https://toffeelive.com/api/v1/init"
              headers = {
                  "User-Agent": "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Origin": "https://toffeelive.com",
                  "Referer": "https://toffeelive.com/",
                  "Sec-Fetch-Dest": "empty",
                  "Sec-Fetch-Mode": "cors",
                  "Sec-Fetch-Site": "same-origin"
              }

              try:
                  session = requests.Session()
                  res1 = session.get("https://toffeelive.com/", headers=headers, timeout=15)
                  res2 = session.get(url, headers=headers, timeout=15)
                  
                  cookies_dict = session.cookies.get_dict()
                  if cookies_dict:
                      return "; ".join([f"{k}={v}" for k, v in cookies_dict.items()])
                  
                  raw_cookie = res2.headers.get("Set-Cookie")
                  if raw_cookie:
                      return raw_cookie

                  return None
              except Exception as e:
                  print(f"[-] Cookie Fetch Exception: {e}")
                  return None

          SRC_JSON = "api.json"

          try:
              print("[+] Generating fresh Toffee cookie...")
              ck = get_direct_toffee_cookie()
              
              if not ck:
                  print("[-] Error: Direct Cookie Generation Failed")
                  sys.exit(1)

              print(f"[+] Cookie generated: {ck[:30]}...")

              if not os.path.exists(SRC_JSON):
                  print(f"[-] Error: '{SRC_JSON}' not found!")
                  sys.exit(1)

              with open(SRC_JSON, "r", encoding="utf-8") as f:
                  channels = json.load(f)

              ns_json = []
              ott_playlist = "#EXTM3U\n"
              updated = datetime.datetime.now().strftime("%d-%m-%Y %I:%M:%S %p")

              tengo = {
                  "name": "Toffee App All Channels",
                  "owner": "Eamin Talukdar \\ Telegram: https://t.me/eamintalukdar",
                  "channels_amount": 0,
                  "updated_on": updated,
                  "channels": []
              }

              user_agent = "Toffee Eamin Talukdar (Linux;Android 14)"

              for ch in channels:
                  link = ch.get("link")
                  if not link:
                      continue

                  name = ch.get("name", "Live")
                  logo = ch.get("logo", "")
                  cat  = ch.get("category_name", "Bangladeshi")
                  
                  try:
                      host = link.split("//")[-1].split("/")[0]
                  except Exception:
                      host = ""

                  # NS Player Format
                  ns_json.append({
                      "name": name,
                      "logo": logo,
                      "link": link,
                      "User-Agent": user_agent,
                      "cookie": ck
                  })

                  # Script API Format
                  tengo["channels"].append({
                      "category_name": cat,
                      "name": name,
                      "link": link,
                      "logo": logo,
                      "headers": {
                          "Host": host,
                          "Cookie": ck,
                          "User-Agent": user_agent,
                          "Accept-Encoding": "gzip"
                      }
                  })

                  # OTT Navigator Format
                  ott_playlist += f'#EXTINF:-1 group-title="{cat}" tvg-logo="{logo}", {name}\n'
                  ott_playlist += f'#EXTVLCOPT:http-user-agent={user_agent}\n'
                  ott_playlist += f'#EXTVLCOPT:http-cookie={ck}\n'
                  ott_playlist += f'{link}\n'

              tengo["channels_amount"] = len(ns_json)

              # ১. NS Player format
              with open("NS_Player.m3u", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              # ২. Channels JSON
              with open("channels.json", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              # ৩. Script API JSON
              with open("Script_Api.json", "w", encoding="utf-8") as f:
                  json.dump(tengo, f, indent=2)

              # ৪. OTT Navigator M3U Playlist
              with open("OTT_Navigator.m3u", "w", encoding="utf-8") as f:
                  f.write(ott_playlist)

              print("[+] All files including NS_Player.m3u generated successfully!")

          except Exception as e:
              print(f"[-] Execution Error: {e}")
              sys.exit(1)
          EOF

      - name: Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || (git commit -m "🔁 Auto Update Toffee Streams" && git push origin main)
