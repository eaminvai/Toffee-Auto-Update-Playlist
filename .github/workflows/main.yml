name: Toffee Cookie Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Execute Update
        run: |
          python3 - << 'EOF'
          import requests, json, datetime, os, sys

          def fetch_toffee_session():
              # Real Android App Headers Simulation
              url = "https://toffeelive.com/api/v1/init"
              
              headers = {
                  "User-Agent": "Toffee/3.10.0 (Linux; Android 14)",
                  "Accept-Encoding": "gzip",
                  "X-Requested-With": "com.toffee.live",
                  "Connection": "Keep-Alive"
              }

              try:
                  session = requests.Session()
                  # Send Session Request
                  response = session.get(url, headers=headers, timeout=15)
                  
                  # Extract Cookies
                  cookies = session.cookies.get_dict()
                  
                  if cookies:
                      cookie_str = "; ".join([f"{k}={v}" for k, v in cookies.items()])
                      return cookie_str
                      
                  # Fallback header extraction
                  set_cookie = response.headers.get("Set-Cookie")
                  if set_cookie:
                      return set_cookie

                  return None
              except Exception as e:
                  print(f"[-] Session Fetch Error: {e}")
                  return None

          SRC_JSON = "api.json"

          try:
              print("[+] Fetching Toffee dynamic credentials...")
              ck = fetch_toffee_session()

              # Fallback statically if GH Actions IP is restricted
              if not ck:
                  print("[-] Warning: Direct session request failed. Retrying web edge request...")
                  # Backup Web Edge Endpoint
                  web_res = requests.get("https://toffeelive.com/", headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  ck = "; ".join([f"{k}={v}" for k, v in web_res.cookies.get_dict().items()])

              if not ck:
                  print("[-] Critical Error: Unable to fetch Cookie.")
                  sys.exit(1)

              print(f"[+] Fresh Cookie obtained successfully: {ck[:30]}...")

              if not os.path.exists(SRC_JSON):
                  print(f"[-] Error: '{SRC_JSON}' not found!")
                  sys.exit(1)

              with open(SRC_JSON, "r", encoding="utf-8") as f:
                  channels = json.load(f)

              ns_json = []
              ott_playlist = "#EXTM3U\n"
              updated = datetime.datetime.now().strftime("%d-%m-%Y %I:%M:%S %p")

              tengo = {
                  "name": "Toffee App All Channels",
                  "owner": "Eamin Talukdar \\ Telegram: https://t.me/eamintalukdar",
                  "channels_amount": 0,
                  "updated_on": updated,
                  "channels": []
              }

              ua = "Toffee/3.10.0 (Linux; Android 14)"

              for ch in channels:
                  link = ch.get("link")
                  if not link:
                      continue

                  name = ch.get("name", "Live")
                  logo = ch.get("logo", "")
                  cat  = ch.get("category_name", "Bangladeshi")
                  
                  try:
                      host = link.split("//")[-1].split("/")[0]
                  except Exception:
                      host = ""

                  ns_json.append({
                      "name": name,
                      "logo": logo,
                      "link": link,
                      "User-Agent": ua,
                      "cookie": ck
                  })

                  tengo["channels"].append({
                      "category_name": cat,
                      "name": name,
                      "link": link,
                      "logo": logo,
                      "headers": {
                          "Host": host,
                          "Cookie": ck,
                          "User-Agent": ua,
                          "Accept-Encoding": "gzip"
                      }
                  })

                  # Playback Headers Mapping
                  ott_playlist += f'#EXTINF:-1 group-title="{cat}" tvg-logo="{logo}", {name}\n'
                  ott_playlist += f'#EXTVLCOPT:http-user-agent={ua}\n'
                  ott_playlist += f'#EXTVLCOPT:http-referrer=https://toffeelive.com/\n'
                  ott_playlist += f'#EXTVLCOPT:http-cookie={ck}\n'
                  ott_playlist += f'{link}\n'

              tengo["channels_amount"] = len(ns_json)

              with open("NS_Player.m3u", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              with open("channels.json", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              with open("Script_Api.json", "w", encoding="utf-8") as f:
                  json.dump(tengo, f, indent=2)

              with open("OTT_Navigator.m3u", "w", encoding="utf-8") as f:
                  f.write(ott_playlist)

              print("[+] All Files and M3U playlists updated successfully!")

          except Exception as e:
              print(f"[-] Execution Error: {e}")
              sys.exit(1)
          EOF

      - name: Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || (git commit -m "🔁 Auto Update Toffee Streams" && git push origin main)
