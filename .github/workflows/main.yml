name: Toffee Cookie Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Update
        run: |
          python3 - << 'EOF'
          import requests, json, datetime, os, sys

          # Dynamic Cookie Source
          RAW_COOKIE_SOURCE = "https://raw.githubusercontent.com/BINOD-XD/Toffee-Auto-Update-Playlist/refs/heads/main/toffee_channel_data.json"
          SRC_JSON = "api.json"

          try:
              print("[+] Fetching live cookie from raw GitHub source...")
              r = requests.get(RAW_COOKIE_SOURCE, timeout=15)
              r.raise_for_status()
              
              source_data = r.json()
              ck = source_data.get("set_cookie", "")

              if not ck:
                  print("[-] Error: 'set_cookie' is empty in the source JSON!")
                  sys.exit(1)

              print(f"[+] Successfully obtained cookie: {ck[:35]}...")

              # Check local api.json
              if not os.path.exists(SRC_JSON):
                  print(f"[-] Error: '{SRC_JSON}' was not found in repo root!")
                  sys.exit(1)

              with open(SRC_JSON, "r", encoding="utf-8") as f:
                  channels = json.load(f)

              if not channels:
                  print("[-] Error: api.json is empty!")
                  sys.exit(1)

              ns_json = []
              ott_playlist = "#EXTM3U\n"
              updated = datetime.datetime.now().strftime("%d-%m-%Y %I:%M:%S %p")

              user_agent = "Toffee Eamin Talukdar (Linux;Android 14)"

              tengo = {
                  "name": "Toffee App All Channels",
                  "owner": "Eamin Talukdar \\ Telegram: https://t.me/eamintalukdar",
                  "channels_amount": 0,
                  "updated_on": updated,
                  "channels": []
              }

              for ch in channels:
                  link = ch.get("link")
                  if not link:
                      continue

                  name = ch.get("name", "Live")
                  logo = ch.get("logo", "")
                  cat  = ch.get("category_name", "Bangladeshi")
                  
                  try:
                      host = link.split("//")[-1].split("/")[0]
                  except Exception:
                      host = ""

                  # NS Player / channels.json Structure
                  ns_json.append({
                      "name": name,
                      "logo": logo,
                      "link": link,
                      "User-Agent": user_agent,
                      "cookie": ck
                  })

                  # Script_Api Structure
                  tengo["channels"].append({
                      "category_name": cat,
                      "name": name,
                      "link": link,
                      "logo": logo,
                      "headers": {
                          "Host": host,
                          "Cookie": ck,
                          "User-Agent": user_agent,
                          "Accept-Encoding": "gzip"
                      }
                  })

                  # OTT Navigator M3U Structure
                  ott_playlist += f'#EXTINF:-1 group-title="{cat}" tvg-logo="{logo}", {name}\n'
                  ott_playlist += f'#EXTVLCOPT:http-user-agent={user_agent}\n'
                  ott_playlist += f'#EXTVLCOPT:http-cookie={ck}\n'
                  ott_playlist += f'{link}\n'

              tengo["channels_amount"] = len(ns_json)

              # Write output files
              with open("NS_Player.m3u", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              with open("channels.json", "w", encoding="utf-8") as f:
                  json.dump(ns_json, f, indent=2)

              with open("Script_Api.json", "w", encoding="utf-8") as f:
                  json.dump(tengo, f, indent=2)

              with open("OTT_Navigator.m3u", "w", encoding="utf-8") as f:
                  f.write(ott_playlist)

              print("[+] All files updated successfully using working source cookie!")

          except Exception as e:
              print(f"[-] Execution Error: {e}")
              sys.exit(1)
          EOF

      - name: Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || (git commit -m "🔁 Auto Update Toffee Streams" && git push origin main)
